<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header>
    <h1>Rainer's Web Design Site</h1>
    </header>

    <main>
    <div id="message"></div>
    <form action="formprocessing.html" method="post" id="myForm">
    First Name: <input id="firstName" type="text" name="firstName" placeholder="First Name"><br>
    Last Name<input id="lastName" type="text" name="lastName" placeholder="Last Name"><br>
    Password: <input type="password" name="pass" id="password"><br>
    Remember Me: <input type="checkbox" name="remember" checked id="remember"><br>
    Age: <input type="number" name="age" id="age"><br>
    Birth Date: <input type="date" name="birthDate" id="birthDate"><br>
    Class:
    <input type="radio" name="class" value="freshman">Freshman<br>
    <input type="radio" name="class" value="sophomore">Sophomore<br>
    <input type="radio" name="class" value="junior">Junior<br>
    <input type="radio" name="class" value="senior">Senior<br>

    State:<select name="state" id="state">
            <option value="blank" disabled selected>Make Selection</option>
            <option value="CA">California</option>
            <option value="HI">Hawaii</option>
            <option value="UT">Utah</option>
        </select><br>
    <input type="submit">
    </form>
    </main>

    <footer>
    <p>&copy; 2026 Rainer Tang</p>
    </footer>
    <script src="formprocessing.js"></script>

</body>
</html>
